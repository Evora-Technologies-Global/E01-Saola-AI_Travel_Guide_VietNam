# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
#
# 8g of heap, rather than the 4g that is enough for the Android build: a Kotlin/Native
# release build compiles the whole Compose Multiplatform graph with -opt in one shot, and at
# 4g the daemon spends the build in full GC and Gradle eventually kills it with
# "Gradle build daemon has been stopped: since the JVM garbage collector is thrashing".
# Metaspace is separate from the heap and holds the KSP processors (Room) alongside KGP and
# AGP, which the default 256m cannot fit.
#
# Careful: an `org.gradle.jvmargs` in ~/.gradle/gradle.properties *overrides* this one — Gradle
# reads GRADLE_USER_HOME before the project. If a release iOS build dies with "Gradle build
# daemon has been stopped: since the JVM garbage collector is thrashing", check there first;
# the failure message reports the heap actually in force, which is the value to compare against.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate process with its own default heap, which the JVM
# sizes from available RAM and is not enough for a module the size of :shared.
kotlin.daemon.jvmargs=-Xmx4096m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
org.gradle.caching=true

# AGP 9 ships built-in Kotlin support, which by default rejects any plugin that
# registers sources through the `kotlin.sourceSets` DSL. KSP still does exactly
# that for its generated output, so the check has to be relaxed for Room.
# See https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# The app version, in one place.
#
# Read by `:app` (the APK's versionName/versionCode and the date-stamped artifact name) and by
# `:shared` (the version shown in the Settings footer). They used to be written out separately
# and had already drifted — the APK said 1.0 while the footer said 1.0.0.
#
# Override for a one-off build with `-Pvietlens.versionName=1.1 -Pvietlens.versionCode=2`.
vietlens.versionName=1.0.0
vietlens.versionCode=100