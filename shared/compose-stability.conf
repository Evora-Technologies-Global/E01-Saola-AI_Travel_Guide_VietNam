// Classes the Compose compiler must treat as stable.
//
// (Comments in this file are `//`; a `#` is parsed as part of a class pattern and fails
// the build with "Error parsing stability configuration file on line 0".)
//
// WHY THIS FILE EXISTS
//
// Compose infers stability by looking at a class's own bytecode, and it can only do that
// for classes compiled by the Compose compiler plugin. `:domain` and `:data` are not —
// they are deliberately plain Kotlin modules with no Compose dependency at all, which is
// the point of the layering. The consequence is that every domain type reaching a
// composable — `Discovery`, `GeoPoint`, `AppError`, `NearbyPlace`, `ChatMessage` — was
// marked *unstable* even though each one is an immutable `data class` with `val`s only.
//
// Unstable is not a warning; it is a behaviour. A composable taking an unstable parameter
// compares it by reference rather than by `equals`, so it can never be skipped once a new
// instance exists. Since every `setState { copy(...) }` produces a new state object, the
// whole screen below it re-executed on every emission. On the lens that is the stage
// ticker every 1.8s and the self-timer every 1s repainting the entire viewfinder tree.
//
// Listing them here tells the compiler what is already true of the code, rather than
// changing the code to prove it. The alternative — annotating each domain class
// `@Immutable` — would put a Compose dependency in `:domain` and break the layering the
// module exists to enforce.
//
// THE CONTRACT THIS ASSERTS
//
// Everything named below must be genuinely immutable after construction: `val`-only
// properties whose own types are stable, and no collection that is ever mutated in place.
// `ComposeStabilityReportTest` in shared/src/commonTest re-checks the resulting report on
// every build, so a class added here that does not hold up is caught rather than assumed.

// --- Kotlin's read-only collection interfaces ---------------------------------
//
// `List`/`Map`/`Set` are interfaces, so the compiler cannot rule out a caller passing a
// `mutableListOf(...)` and mutating it later. In this codebase they never do: every list
// on a state object arrives from Room via a Flow, from a `map`/`filter` chain, or from a
// `listOf(...)`, and is replaced wholesale rather than edited. The
// kotlinx.collections.immutable alternative would express that in the type system, at the
// cost of a conversion at every repository boundary for a guarantee the architecture
// already provides.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// `IntRange` is a `val`-only class over two ints; it is only unstable because the stdlib
// is compiled without the Compose plugin, exactly like `:domain` below. It reaches the
// composition as `CameraCapabilities.exposureRange`, and without this line the whole
// capabilities object is unstable and the viewfinder's tool row cannot skip.
kotlin.ranges.IntRange

// --- Time -------------------------------------------------------------------------
//
// `Instant` on every discovery, `LocalDate` on the journal's day grouping. Both are
// immutable value types by construction, and neither library is Compose-aware.
kotlin.time.Instant
kotlin.time.Duration
kotlinx.datetime.LocalDate
kotlinx.datetime.LocalDateTime
kotlinx.datetime.LocalTime

// --- Decoded images ---------------------------------------------------------------
//
// `ImageBitmap` is an interface, so the compiler has to assume an implementation could
// mutate its pixels. The passport is the only screen that holds one directly: covers are
// decoded once in `PassportViewModel.decodeCover` and stored in an immutable `CoverPhoto`
// that is replaced wholesale, never edited. Without this line `PassportState` is unstable
// and the map canvas re-executes on every unrelated state change.
androidx.compose.ui.graphics.ImageBitmap

// --- The domain layer ---------------------------------------------------------
//
// Models, the error hierarchy and the result wrapper. All immutable data classes, sealed
// interfaces of data classes, enums, or value objects; none of them holds mutable state.
com.evora.technologies.saola.domain.model.*
com.evora.technologies.saola.domain.util.*
