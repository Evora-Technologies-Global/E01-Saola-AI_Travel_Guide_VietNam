			shellPath = /bin/sh;
			shellScript = "if [ \"YES\" = \"$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED\" ]; then\n  echo \"Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \\\"YES\\\"\"\n  exit 0\nfi\n# Builds the Kotlin framework and hands it to Xcode.\n#\n# `embedAndSignAppleFrameworkForXcode` is the task every JetBrains tool expects to find here —\n# the Android Studio / IntelliJ Kotlin Multiplatform plugin checks for it, and its absence is\n# what the IDE reports as \"missing build guard for an Xcode target\".\n#\n# It reads CONFIGURATION, SDK_NAME and ARCHS out of Xcode's environment and works out which\n# Kotlin target to link, so there is no SDK-to-target mapping to keep in step here. The framework\n# is static, so the task copies it into BUILT_PRODUCTS_DIR and skips the embed and codesign steps\n# on its own.\nset -e\n\ncd \"$SRCROOT/..\"\n\n# Xcode.app is launched by launchd, so it has none of a login shell's environment. `java` on the\n# PATH is the macOS stub, which resolves a real JDK only if one is registered — asking java_home\n# directly is what makes this work the same from Xcode and from a terminal.\nif [ -z \"$JAVA_HOME\" ] && [ -x /usr/libexec/java_home ]; then\n  JAVA_HOME=\"$(/usr/libexec/java_home 2>/dev/null)\" || true\n  export JAVA_HOME\nfi\n\n# Deliberately not --quiet: when this fails, Xcode reports only \"nonzero exit code\", and the\n# Gradle message is the only thing that says why.\n./gradlew --console=plain :shared:embedAndSignAppleFrameworkForXcode";
		};
