[versions]
# Build tooling
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.10"

# Compose Multiplatform. The Compose *compiler* now ships inside the Kotlin plugin,
# so this version only governs the runtime artifacts, the resources generator and
# the iOS/desktop packaging tasks.
composeMultiplatform = "1.12.0-beta03"

# AndroidX — Android-only artifacts (the host app and its platform actuals)
coreKtx = "1.19.0"
activityCompose = "1.13.0"
# Must match what Compose Multiplatform resolves for Android — a different version here
# would put two Compose UI copies on the classpath.
composeUiAndroid = "1.12.0-beta02"
composeIcons = "1.7.8"
camerax = "1.6.1"
exifinterface = "1.4.2"
splashscreen = "1.2.0"

# AndroidX — artifacts that publish Kotlin Multiplatform variants
room = "2.8.4"
sqlite = "2.7.0"
datastore = "1.2.1"

# JetBrains ports of AndroidX libraries (multiplatform group ids)
lifecycle = "2.11.0"
navigationCompose = "2.9.2"

# Kotlin ecosystem
coroutines = "1.11.0"
serializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxIo = "0.9.0"
ktor = "3.5.1"

# Google Play services / ML Kit — Android actuals only
playServicesLocation = "21.4.0"
mlkitTextRecognition = "16.0.1"
# 8.3.1, not 8.4.0: 8.4.0 is compiled by Kotlin 2.4.10, whose binary metadata a 2.3.21
# compiler refuses to read — the same wall Coil 3.5.0 hits below. 8.3.1 is built with
# 2.3.21 exactly. It carries a `compose-bom` constraint of its own, but that BOM names
# Compose UI 1.10.5 and CMP asks for 1.12.0-beta02, so the higher one still wins.
mapsCompose = "8.3.1"

# Misc
koin = "4.2.2"
kermit = "2.1.0"
# 3.4.0, not 3.5.0: Coil 3.5.0 publishes its Apple klibs compiled by Kotlin 2.4, whose
# ABI a 2.3.21 compiler reports as an unresolvable library. 3.4.0 is built with 2.3.10.
coil = "3.4.0"
okio = "3.16.0"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]
# --- AndroidX core (Android host app only) ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Compose, Android-only pieces (tooling + instrumented tests) ---
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUiAndroid" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUiAndroid" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeUiAndroid" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeUiAndroid" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }

# --- JetBrains multiplatform ports of AndroidX ---
jetbrains-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
jetbrains-lifecycle-viewmodel-savedstate = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
jetbrains-compose-ui-backhandler = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "composeMultiplatform" }
jetbrains-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# --- Room (multiplatform) ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# --- DataStore (multiplatform core; the -preferences artifact is Android-only) ---
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }

# --- Kotlin ecosystem ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinxIo" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# --- Ktor ---
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

# --- Koin (multiplatform DI, replaces Hilt) ---
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
koin-compose-viewmodel-navigation = { group = "io.insert-koin", name = "koin-compose-viewmodel-navigation" }
koin-test = { group = "io.insert-koin", name = "koin-test" }

# --- Google Play services / ML Kit (Android actuals) ---
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# The Maps SDK for Android, wrapped for Compose. Android-only by construction — iOS
# draws the same screen with MapKit, which needs no dependency at all because the
# Kotlin/Native Apple platform libraries already bind it.
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }

# On-device OCR. Bundled rather than downloaded on demand: the traveller is
# standing in front of a menu, often on a foreign SIM, and a recogniser that
# has to fetch itself first would fail exactly when it is needed.
mlkit-text-recognition-latin = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-japanese = { group = "com.google.mlkit", name = "text-recognition-japanese", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-korean = { group = "com.google.mlkit", name = "text-recognition-korean", version.ref = "mlkitTextRecognition" }

# --- CameraX (Android actual for the lens screen) ---
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# --- Logging (multiplatform Timber replacement: logcat on Android, os_log on iOS) ---
kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }

# --- Images ---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# --- Testing ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP's own plugin for the Android target of a Kotlin Multiplatform library.
# Replaces `com.android.library` + `androidTarget()`, which AGP 9 no longer accepts.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
